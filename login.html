```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SeedFlow</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "DM Sans", sans-serif;
            background: #eef1e9;
            color: #183326;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(24, 51, 38, 0.12);
        }

        .visual {
            min-height: 620px;
            position: relative;
            background:
                linear-gradient(to top, rgba(15, 45, 25, 0.85), rgba(15, 45, 25, 0.05)),
                url("https://images.unsplash.com/photo-1495107334309-fcf20504a5ab?auto=format&fit=crop&w=1200&q=85");
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            padding: 40px;
            color: white;
        }

        .visual h2 {
            font-family: "Playfair Display", serif;
            font-size: 43px;
            line-height: 1.15;
            margin: 15px 0;
        }

        .visual p {
            font-size: 14px;
            line-height: 1.7;
            color: #e5eee4;
        }

        .mini-logo {
            font-size: 25px;
            background: rgba(255, 255, 255, 0.2);
            padding: 12px;
            border-radius: 12px;
            display: inline-block;
        }

        .login-area {
            padding: 50px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;

        .brand {
            display: flex;
            align-items: center;

        .brand-icon {
            background: #285c3b;

            font-family: "Playfair Display", serif;

            margin-bottom: 10px;

            color: #718078;

                min-height: 220px;
                padding: 25px;

            .visual h2 {

            }

            .login-area {

            .brand {
                margin-bottom: 25px;

<body>

    <main class="login-wrapper">

        <section class="visual">
            <div>
                <div class="mini-logo">🌱</div>
                <h2>Grow smarter.<br>Flow better.</h2>
                <p>
                    One connected platform for seed companies,
                    farmers and quality teams.
                </p>
            </div>
        </section>

        <section class="login-area">

            <div class="brand">
                <div class="brand-icon">🌱</div>
                SeedFlow
            </div>

            <h1 class="login-heading">Welcome back.</h1>
            <p class="subtitle">
                Sign in to continue managing your seed journey.
            </p>

            <div class="role-title">Continue as</div>

            <div class="roles">
                <button type="button" class="role active"
                    onclick="selectRole(this, 'Farmer')">
                    <span class="role-icon">👨‍🌾</span>
                    Farmer
                </button>

                <button type="button" class="role"
                    onclick="selectRole(this, 'Company')">
                    <span class="role-icon">🏢</span>
                    Company
                </button>
            </div>

            <form id="loginForm">

                <div class="input-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>

                    <div class="input-box">
                        <input
                            type="password"
                            id="password"
                            class="password-field"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword()"
                            id="eye"
                            aria-label="Show or hide password">👁</button>
                    </div>
                </div>

                <div class="options">
                    <label class="remember">
                        <input type="checkbox" id="remember">
                        Remember me
                    </label>

                    <a href="#" class="forgot"
                        onclick="forgotPassword(event)">Forgot password?</a>
                </div>

                <button type="submit" class="login-button">
                    Login to SeedFlow →
                </button>

                <p class="message" id="message" role="alert"></p>

            </form>

            <div class="register">
                Don't have an account?
                <a href="#" onclick="createAccount(event)">Create account</a>
            </div>

            <div class="back-home">
                <a href="index.html">← Back to Home</a>
            </div>

        </section>
    </main>

    <script>
        let selectedRole = "Farmer";

        function selectRole(element, role) {
            document.querySelectorAll(".role").forEach(function(button) {
                button.classList.remove("active");
            });

            element.classList.add("active");
            selectedRole = role;
        }

        function togglePassword() {
            const password = document.getElementById("password");
            const eye = document.getElementById("eye");

            if (password.type === "password") {
                password.type = "text";
                eye.textContent = "🙈";
            } else {
                password.type = "password";
                eye.textContent = "👁";
            }
        }

        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");

            message.style.display = "none";
            message.textContent = "";

            if (!email || !password.trim()) {
                message.textContent = "Please enter your email and password.";
                message.style.display = "block";
                return;
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                message.textContent = "Please enter a valid email address.";
                message.style.display = "block";
                return;
            }

            // Demo login only. This does not verify credentials.
            sessionStorage.setItem("seedflowRole", selectedRole);
            sessionStorage.setItem("seedflowEmail", email);

            window.location.href = "dashboard.html";
        });

        function forgotPassword(event) {
            event.preventDefault();
            alert("Password reset is not connected yet. Please contact your administrator.");
        }

        function createAccount(event) {
            event.preventDefault();
            alert("Account registration is not connected yet.");
        }
    </script>

</body>
</html>
